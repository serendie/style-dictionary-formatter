version: 2
updates:
  # セキュリティ更新用。target-branch を持たないこのエントリだけがセキュリティ更新に使われる
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # バージョン更新を停止する（セキュリティ更新はこの上限の対象外）
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"
